<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="6GxNWaMxTZM6x9dCQ2hBe2GWSjk4K0tkgV3y3yCPxxE" />

    <!-- Title and Description for Search Engines -->
    <title>WORLDORA - Marketplace B2B Internationale</title>
    <meta name="description" content="Plateforme mondiale de commerce B2B reliant acheteurs et fournisseurs : catalogue produits, messagerie directe sécurisée et gestion de stocks." />
    <meta name="keywords" content="WORLDORA, B2B, marketplace, commerce international, import export, fournisseurs, grossistes, devis, produits industriels" />
    <meta name="author" content="WORLDORA" />
    <meta name="theme-color" content="#090d16" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn / Google Rich Snippets -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WORLDORA" />
    <meta property="og:title" content="WORLDORA - Marketplace B2B Internationale" />
    <meta property="og:description" content="Plateforme mondiale de commerce B2B reliant acheteurs et fournisseurs : catalogue produits, messagerie directe sécurisée et gestion de stocks." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="WORLDORA - Marketplace B2B Internationale" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WORLDORA - Marketplace B2B Internationale" />
    <meta name="twitter:description" content="Plateforme mondiale de commerce B2B reliant acheteurs et fournisseurs : catalogue produits, messagerie directe sécurisée et gestion de stocks." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="twitter:image:alt" content="WORLDORA - Marketplace B2B Internationale" />

    <!-- Google Search Results Favicon & Browser Icons (48px multiple compliant) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Schema.org JSON-LD for Google Search Rich Snippets & Brand Logo -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "WORLDORA",
      "alternateName": "Worldora B2B",
      "description": "Plateforme mondiale de commerce B2B reliant acheteurs et fournisseurs : catalogue produits, messagerie directe sécurisée et gestion de stocks.",
      "logo": "/logo-square.jpg",
      "image": "/og-image.jpg"
    }
    </script>

    <!-- Dynamic absolute URL resolution for social crawlers -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && ogImg.getAttribute('content').startsWith('/')) {
            ogImg.setAttribute('content', origin + ogImg.getAttribute('content'));
          }
          var ogSecImg = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogSecImg && ogSecImg.getAttribute('content').startsWith('/')) {
            ogSecImg.setAttribute('content', origin + ogSecImg.getAttribute('content'));
          }
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && twImg.getAttribute('content').startsWith('/')) {
            twImg.setAttribute('content', origin + twImg.getAttribute('content'));
          }
        } catch (e) {}
      })();
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
      </html>
