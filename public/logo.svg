<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bronze Shadow Gradient -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Globe Ring Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="1" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Globe Latitudes / Meridians -->
  <ellipse cx="64" cy="64" rx="46" ry="46" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.18" />
  <ellipse cx="64" cy="64" rx="46" ry="22" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />
  <line x1="18" y1="64" x2="110" y2="64" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />
  <ellipse cx="64" cy="64" rx="22" ry="46" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />

  <!-- Dynamic Orbital Ring (Trade Highway) -->
  <path d="M 22 76 C 28 36, 100 24, 106 52 C 108 58, 104 68, 92 78" 
        fill="none" stroke="url(#globeGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 1" opacity="0.9" />

  <!-- Orbital Trade Nodes / Satellites -->
  <circle cx="104" cy="50" r="3" fill="#fef08a" filter="url(#glow)" />
  <circle cx="28" cy="72" r="2" fill="#38bdf8" />
  <circle cx="64" cy="30" r="2" fill="#f59e0b" />

  <!-- Premium Geometric "W" Monogram -->
  <!-- Left Outer Wing -->
  <polygon points="26,38 37,38 50,86 40,86" fill="url(#goldGrad)" />
  <!-- Left Inner Wing -->
  <polygon points="40,86 50,86 64,52 57,48" fill="url(#bronzeGrad)" />
  <!-- Right Inner Wing -->
  <polygon points="64,52 71,48 78,86 68,86" fill="url(#goldGrad)" />
  <!-- Right Outer Wing -->
  <polygon points="68,86 78,86 91,38 102,38 85,92 68,92 64,74 60,92 43,92" fill="none" />
  <polygon points="78,86 88,86 102,38 91,38" fill="url(#goldGrad)" />

  <!-- Center Diamond Apex Node -->
  <polygon points="64,46 69,54 64,62 59,54" fill="#fef08a" filter="url(#glow)" />

  <!-- Modern Accent Sparkle -->
  <path d="M 98 26 Q 98 32 104 32 Q 98 32 98 38 Q 98 32 92 32 Q 98 32 98 26 Z" fill="#fef08a" opacity="0.9" />
</svg>
